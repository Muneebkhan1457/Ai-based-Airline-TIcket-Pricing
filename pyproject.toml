[project]
name = "pia-pricing-mvp"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "mlflow>=2.14.0",
    "pandas>=2.0.0",
    "numpy>=1.20.0",
    "scikit-learn>=1.0.0",
    "xgboost>=1.5.0",
    "joblib>=1.0.0",
    "fastapi>=0.100.0,<0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "streamlit>=1.35.0",
    "requests>=2.0.0",
    "apscheduler>=3.10.0",
    "python-dotenv",
    "beautifulsoup4",
    "playwright==1.61.0",
    "starlette<0.39.0",
    "lightgbm>=4.7.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
