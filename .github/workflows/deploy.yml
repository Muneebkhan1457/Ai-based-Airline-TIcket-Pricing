name: 🚀 Build & Deploy to EC2

on:
  push:
    branches:
      - main          # sirf main branch pe push hone pr chalega
  workflow_dispatch:  # manually bhi trigger kar sakte ho GitHub UI se

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  IMAGE_API: ${{ secrets.DOCKERHUB_USERNAME }}/pia-pricing-api
  IMAGE_UI:  ${{ secrets.DOCKERHUB_USERNAME }}/pia-pricing-ui

jobs:
  # ─────────────────────────────────────────────────────────
  # JOB 1: Build Docker images and push to Docker Hub
  # ─────────────────────────────────────────────────────────
  build-and-push:
    name: 🐳 Build & Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🔑 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build & Push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ${{ env.IMAGE_API }}:latest
            ${{ env.IMAGE_API }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🏗️ Build & Push UI image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.ui
          push: true
          tags: |
            ${{ env.IMAGE_UI }}:latest
            ${{ env.IMAGE_UI }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────
  # JOB 2: SSH into EC2, pull new images, restart containers
  # ─────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push     # pehle build hona chahiye

    steps:
      - name: ⬇️ Checkout code (for docker-compose.yml)
        uses: actions/checkout@v4

      - name: 📄 Copy docker-compose to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host:        ${{ secrets.EC2_HOST }}
          username:    ubuntu
          key:         ${{ secrets.EC2_SSH_KEY }}
          source:      "docker-compose.prod.yml"
          target:      "~/app/"
          strip_components: 0

      - name: 🔄 SSH → Pull images & Restart containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ubuntu
          key:      ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "=== Logging in to Docker Hub ==="
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | sudo docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            echo "=== Pulling latest images ==="
            sudo docker pull ${{ env.IMAGE_API }}:latest
            sudo docker pull ${{ env.IMAGE_UI }}:latest

            echo "=== Restarting containers ==="
            cd ~/app
            sudo docker compose -f docker-compose.prod.yml up -d --force-recreate --no-build

            echo "=== Cleaning up old images ==="
            sudo docker image prune -f

            echo "=== ✅ Deployment complete! ==="
            sudo docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
